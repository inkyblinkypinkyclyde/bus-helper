name: slack-bot

on:
  push:
    paths:
      - "slack-bot/**"
      - ".github/workflows/slack-bot.yml"

concurrency:
  group: slack-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slack-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: slack-bot/go.mod
          cache-dependency-path: slack-bot/go.sum

      - run: go vet ./...

      - run: go test ./...
