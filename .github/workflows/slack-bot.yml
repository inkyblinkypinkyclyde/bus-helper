name: slack-bot

on:
  push:
    paths:
      - "slack-bot/**"
      - ".github/workflows/slack-bot.yml"

concurrency:
  group: slack-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slack-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: slack-bot/go.mod
          cache-dependency-path: slack-bot/go.sum

      - run: go vet ./...

      - run: go test ./...

  release:
    needs: test
    # Only runs once the change lands on master
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: slack-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: slack-bot/go.mod
          cache-dependency-path: slack-bot/go.sum

      - run: make build-all

      - name: Generate checksums
        run: cd build && sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "slack-bot-${{ github.run_number }}" build/* \
            --target "${{ github.sha }}" \
            --title "slack-bot build ${{ github.run_number }}" \
            --generate-notes
