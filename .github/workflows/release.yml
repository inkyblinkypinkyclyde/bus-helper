name: release

on:
  push:
    branches: [master]
    paths:
      - "slack-bot/**"
      - "bods-helper/**"
      - ".github/workflows/release.yml"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04 # older glibc keeps the bods-helper binary portable
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: slack-bot/go.mod
          cache-dependency-path: slack-bot/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            bods-helper/requirements.txt
            bods-helper/requirements-build.txt

      - name: Build slack-bot
        run: make build-all
        working-directory: slack-bot

      - name: Build bods-helper
        run: make build
        working-directory: bods-helper

      - name: Collect artifacts
        run: |
          mkdir release
          cp slack-bot/build/* release/
          cp bods-helper/dist/bods-helper release/
          cd release && sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" release/* \
            --target "${{ github.sha }}" \
            --title "build ${{ github.run_number }}" \
            --generate-notes
