name: bods-helper

on:
  push:
    paths:
      - "bods-helper/**"
      - ".github/workflows/bods-helper.yml"

concurrency:
  group: bods-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bods-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bods-helper/requirements.txt

      - run: python -m pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v

  release:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bods-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            bods-helper/requirements.txt
            bods-helper/requirements-build.txt

      - run: make build

      - name: Generate checksums
        run: cd dist && sha256sum bods-helper > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "bods-helper-${{ github.run_number }}" dist/bods-helper dist/checksums.txt \
            --target "${{ github.sha }}" \
            --title "bods-helper build ${{ github.run_number }}" \
            --generate-notes