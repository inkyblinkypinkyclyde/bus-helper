name: bods-helper

on:
  push:
    paths:
      - "bods-helper/**"
      - ".github/workflows/bods-helper.yml"

concurrency:
  group: bods-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bods-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bods-helper/requirements.txt

      - run: python -m pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v